# tag-release — after a registry worker release reaches main, GitHub itself tags that commit with the release's own
# number: worker-v<version in lij-worker/package.json> (worker-v0.23.0). It publishes nothing: the commit is already on
# main; this only names it. A tag that exists is never moved or remade. It uses the run's own token (contents: write) —
# no secret is added. The same workflow the wallet and adapter repositories carry.
name: tag-release
on:
  push:
    branches: [main]
    paths:
      - lij-worker/package.json
      - .github/workflows/tag-release.yml
  workflow_dispatch: {}   # a run by hand makes the tag on main's head when the tag is missing; a tag that exists is left as it is
permissions:
  contents: write
concurrency:
  group: tag-release
  cancel-in-progress: false
jobs:
  tag:
    if: github.repository == 'dav1dpgit/LIJOX'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: tag this commit with the worker's version, if the tag does not exist
        run: |
          set -euo pipefail
          V=$(grep -m1 -o '"version": *"[0-9]\+\.[0-9]\+\.[0-9]\+"' lij-worker/package.json | grep -o '[0-9]\+\.[0-9]\+\.[0-9]\+')
          TAG="worker-v${V}"
          echo "$TAG" | grep -Eq '^worker-v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "could not read the version (got '$TAG')"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "tag ${TAG} exists — left as it is"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "${TAG}" "${GITHUB_SHA}"
          git push origin "refs/tags/${TAG}"
          echo "tagged ${GITHUB_SHA} as ${TAG}"
